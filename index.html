<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מעקב מחירי טיסות</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E✈%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --ink: #18212b; --muted: #637083; --line: #e2e7ed;
    --accent: #1f6feb; --accent-ink: #fff; --good: #137a3a; --good-bg: #e7f5ec;
    --warn: #8a5a00; --warn-bg: #fff4d6; --bad: #b42318; --bad-bg: #fdecea; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1040px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; flex: 1; white-space: nowrap; }
  .auto { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #9aa5b1; }
  .dot.on { background: #1a9f4b; }
  .usage { font-size: 13px; color: var(--muted); min-width: 210px; }
  .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .meter > div { height: 100%; background: var(--accent); }
  nav { max-width: 1040px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px;
               font: inherit; color: var(--muted); cursor: pointer; }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  button.btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
               border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.btn:hover { border-color: #b8c2cd; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  .banner { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.good { background: var(--good-bg); color: var(--good); }
  .banner .grow { flex: 1; min-width: 220px; }
  a { color: var(--accent); }

  /* results */
  .dest { display: grid; grid-template-columns: 150px 120px 1fr 130px; gap: 14px; align-items: center;
          padding: 12px 0; border-top: 1px solid var(--line); }
  .dest:first-of-type { border-top: 0; }
  .dname { font-weight: 600; }
  .dcode { color: var(--muted); font-size: 12px; direction: ltr; text-align: right; }
  .price { font-size: 22px; font-weight: 700; direction: ltr; text-align: right; }
  .price.none { font-size: 14px; font-weight: 400; color: var(--muted); }
  .detail { font-size: 13px; }
  .detail .when { font-weight: 600; }
  .cover { font-size: 12px; color: var(--muted); }
  .cover .meter { height: 4px; width: 120px; }
  .more { grid-column: 1 / -1; font-size: 13px; background: var(--bg); border-radius: 8px; padding: 8px 12px; }
  .more table { width: 100%; border-collapse: collapse; }
  .more td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  .more tr:first-child td { border-top: 0; }
  .best { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--good-bg); color: var(--good); margin-top: 3px; }
  .site { margin-top: 12px; padding: 12px; border-radius: 8px; background: #eef4fe; }
  .qr { margin-top: 10px; } .qr img, .qr canvas { background: #fff; padding: 8px; border-radius: 8px; }
  .destsearch { position: relative; max-width: 420px; }
  .suggest { position: absolute; z-index: 20; inset-inline: 0; top: calc(100% + 4px); background: var(--card);
             border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); overflow: hidden; }
  .suggest button { display: block; width: 100%; text-align: start; background: none; border: 0; border-top: 1px solid var(--line);
                    padding: 10px 12px; font: inherit; color: var(--ink); cursor: pointer; }
  .suggest button:first-child { border-top: 0; }
  .suggest button:hover, .suggest button:focus { background: #eef4fe; }
  .land { font-size: 12px; color: var(--good); }
  .regionbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: #fafbfc; }
  .regionbox .ap { display: flex; align-items: center; gap: 4px; font-size: 14px; padding: 2px 0; }
  .regionbox .ap .sub { margin-inline-start: 6px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); margin-inline-start: 4px; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  svg.spark { width: 130px; height: 34px; }

  /* trips */
  .trip-row { display: flex; gap: 12px; align-items: flex-start; }
  .trip-row .grow { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: #eaf1fe; color: #194a9c; border-radius: 14px; padding: 2px 10px; font-size: 13px; }
  .chip button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 4px 0 0; font-size: 14px; }
  .off { opacity: .55; }
  form .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select { font: inherit; width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  input[type=checkbox], input[type=radio] { width: auto; margin-inline-end: 6px; flex: none; }
  input:focus, select:focus { outline: 2px solid #b6d0fb; border-color: var(--accent); }
  .ltr { direction: ltr; text-align: right; }
  .full { grid-column: 1 / -1; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .check { display: flex; align-items: center; color: var(--ink); font-size: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; }
  pre { background: #0f1720; color: #d7e0ea; padding: 12px; border-radius: 8px; overflow: auto; max-height: 340px;
        font-size: 12px; direction: ltr; text-align: left; white-space: pre-wrap; }
  .empty { text-align: center; padding: 36px 10px; color: var(--muted); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #18212b; color: #fff;
           padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) {
    .dest { grid-template-columns: 1fr 1fr; }
    .dest .detail { grid-column: 1 / -1; }
    .trip-row { flex-wrap: wrap; } .trip-row .grow { flex-basis: 100%; }
    .bar { padding: 10px 14px; gap: 10px; } main { padding: 14px; }
    .dest .spark-wrap { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>✈ מעקב מחירי טיסות</h1>
    <div class="usage" id="usage"></div>
    <div class="auto" id="autoBox"></div>
    <button class="btn primary" id="checkBtn">בדוק עכשיו</button>
  </div>
  <nav>
    <button data-tab="results" class="on">תוצאות</button>
    <button data-tab="trips">טיולים</button>
    <button data-tab="settings">הגדרות</button>
  </nav>
</header>
<main>
  <div id="banners"></div>
  <section id="tab-results"></section>
  <section id="tab-trips" hidden></section>
  <section id="tab-settings" hidden></section>
</main>
<div class="toast" id="toast"></div>

/*TOML-START*/
// Reads and writes the small subset of TOML that flightwatch's config.toml uses.
function tomlValue(raw) {
  const v = raw.trim();
  if (v.startsWith('"')) {   // basic string with escapes
    const map = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", '"': '"', "\\": "\\" };
    let out = "", i = 1;
    while (i < v.length - 1) {
      if (v[i] !== "\\") { out += v[i++]; continue; }
      const n = v[i + 1];
      if (n === "u") { out += String.fromCharCode(parseInt(v.substr(i + 2, 4), 16)); i += 6; continue; }
      out += map[n] ?? n; i += 2;
    }
    return out;
  }
  if (v === "true" || v === "false") return v === "true";
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  if (v.startsWith("[")) {
    const inner = v.slice(1, -1).trim(), out = []; let cur = "", q = false, esc = false;
    for (const ch of inner) {
      if (q) { cur += ch; if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') q = false; }
      else if (ch === '"') { q = true; cur += ch; }
      else if (ch === ",") { if (cur.trim()) out.push(tomlValue(cur)); cur = ""; }
      else cur += ch;
    }
    if (cur.trim()) out.push(tomlValue(cur));
    return out;
  }
  const n = Number(v);
  if (!Number.isNaN(n)) return n;
  throw new Error("cannot read value: " + v);
}
function stripComment(line) {
  let q = false, esc = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') q = false; }
    else if (ch === '"') q = true;
    else if (ch === "#") return line.slice(0, i);
  }
  return line;
}
function parseToml(text) {
  const out = { settings: {}, watch: [] }; let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = stripComment(raw).trim();
    if (!line) continue;
    if (line === "[settings]") { cur = out.settings; continue; }
    if (line === "[[watch]]") { cur = {}; out.watch.push(cur); continue; }
    const i = line.indexOf("=");
    if (i < 0 || !cur) continue;
    cur[line.slice(0, i).trim()] = tomlValue(line.slice(i + 1));
  }
  return out;
}
const TRIP_KEYS = ["name", "enabled", "origins", "destinations", "depart_from", "depart_to", "min_nights",
  "max_nights", "one_way", "max_stops", "target_price", "split_tickets"];
function tomlOut(v) {
  if (typeof v === "boolean") return v ? "true" : "false";
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(v);
  if (Array.isArray(v)) return "[" + v.map(tomlOut).join(", ") + "]";
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(v))) return String(v);
  return JSON.stringify(String(v));
}
function dumpToml(settings, trips) {
  const lines = ["# flightwatch settings. Edited by the flightwatch screen; you can also edit it by hand.", "", "[settings]"];
  for (const [k, v] of Object.entries(settings)) if (v !== null && v !== undefined) lines.push(`${k} = ${tomlOut(v)}`);
  for (const t of trips) {
    lines.push("", "[[watch]]");
    for (const k of TRIP_KEYS) if (t[k] !== null && t[k] !== undefined && t[k] !== "") lines.push(`${k} = ${tomlOut(t[k])}`);
  }
  return lines.join("\n") + "\n";
}
/*TOML-END*/

const web = {
  conn: null, sha: null, raw: null,
  load() {
    try {
      const h = new URLSearchParams(location.hash.slice(1));
      if (h.get("t")) {   // opened from the computer's link or QR code: remember it, then clear the address bar
        localStorage.setItem(STORE_KEY, JSON.stringify({ repo: h.get("repo") || DEFAULT_REPO, token: h.get("t") }));
        history.replaceState(null, "", location.pathname);
      }
      this.conn = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    } catch { this.conn = null; }
    return this.conn;
  },
  save(repo, token) {
    this.conn = { repo: repo.replace(/^https:\/\/github.com\//, "").replace(/\/$/, ""), token };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.conn)); } catch {}
  },
  forget() { try { localStorage.removeItem(STORE_KEY); } catch {} this.conn = null; },
  async gh(method, path, body) {
    const r = await fetch(`https://api.github.com/repos/${this.conn.repo}${path}`, {
      method, headers: { Authorization: `Bearer ${this.conn.token}`, Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined, cache: "no-store",
    });
    if (r.status === 204) return null;
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) throw Object.assign(new Error("GitHub לא מכיר את מפתח הגישה (שגוי או בוטל)"), { auth: true });
    if (r.status === 404) return Object.assign({}, { __missing: true });
    if (!r.ok) throw Object.assign(new Error(data.message || `GitHub ${r.status}`), { status: r.status });
    return data;
  },
  async file(path) {
    const j = await this.gh("GET", `/contents/${path}`);
    if (!j || j.__missing) return null;
    const bytes = Uint8Array.from(atob((j.content || "").replace(/\n/g, "")), c => c.charCodeAt(0));
    return { text: new TextDecoder().decode(bytes), sha: j.sha };
  },
  async putConfig(message) {
    const text = dumpToml(this.raw.settings, this.raw.watch);
    const bytes = new TextEncoder().encode(text); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    const body = { message, content: btoa(bin), sha: this.sha };
    try { this.sha = (await this.gh("PUT", "/contents/config.toml", body)).content.sha; }
    catch (e) {   // changed meanwhile (e.g. by a check): take the newest sha and write ours on top
      if (e.status !== 409 && e.status !== 422) throw e;
      body.sha = (await this.file("config.toml")).sha;
      this.sha = (await this.gh("PUT", "/contents/config.toml", body)).content.sha;
    }
  },
};

function hoursBetween(runsPerDay) { return Math.max(1, Math.round(24 / Math.max(1, runsPerDay || 8))); }
const SETTING_DEFAULTS = { currency: "USD", drop_percent: 10, runs_per_day: 8, max_searches_per_run: 6,
  serpapi_monthly_budget: 240, min_recheck_hours: 12, auto_checks: true };

async function webState() {
  const [cfg, res, runsJ] = await Promise.all([web.file("config.toml"), web.file("results.json"),
    web.gh("GET", "/actions/workflows/flightwatch.yml/runs?per_page=3")]);
  if (!cfg) throw new Error("config.toml לא נמצא במאגר " + web.conn.repo);
  web.raw = parseToml(cfg.text); web.sha = cfg.sha;
  const s = { ...SETTING_DEFAULTS, ...web.raw.settings };
  const data = res ? JSON.parse(res.text) : {};
  const runs = (runsJ && runsJ.workflow_runs) || [];
  const running = runs.some(r => ["queued", "in_progress", "waiting", "pending"].includes(r.status));
  const trips = web.raw.watch.map(t => ({ enabled: true, origins: ["TLV"], destinations: [], min_nights: 0, max_nights: 0,
    one_way: false, max_stops: null, target_price: null, split_tickets: false, ...t }));
  const results = trips.map(t => {
    const prev = (data.results || []).find(r => r.trip === t.name);
    return { trip: t.name, enabled: t.enabled, destinations: t.destinations.map(dest => {
      const d = parseDest(dest), name = d.label || d.codes.join("/");
      const found = prev && prev.destinations.find(x => x.destination === name);
      return found || { destination: name, label: d.label, airports: d.codes, options: [], trend: [],
                        checked: 0, total: combos(t), hint_price: null };
    }) };
  });
  const run = runs[0];
  const now = new Date();
  const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const monthKey = now.toISOString().slice(0, 7);
  const used = data.generated_at && data.generated_at.slice(0, 7) === monthKey ? (data.usage || {}).used || 0 : 0;
  return {
    version: PAGE_VERSION, config_error: null,
    settings: Object.fromEntries(["currency", "drop_percent", "runs_per_day", "max_searches_per_run",
      "serpapi_monthly_budget", "min_recheck_hours"].map(k => [k, s[k]])),
    trips, keys: data.keys || { SERPAPI_KEY: true }, running, last_output: data.last_output || "",
    schedule: { supported: true, installed: true, hours: hoursBetween(s.runs_per_day), enabled: s.auto_checks !== false },
    cloud: { repo: web.conn.repo, url: `https://github.com/${web.conn.repo}`, error: null, running, web: true,
      last_run: run ? { at: run.run_started_at || run.created_at, status: run.status, conclusion: run.conclusion, url: run.html_url } : null },
    results,
    usage: { used, budget: s.serpapi_monthly_budget, per_run: s.serpapi_monthly_budget / (Math.max(1, s.runs_per_day) * days) },
  };
}

async function webApi(path, body) {
  if (path === "/api/state") return webState();
  if (path === "/api/trips") { web.raw.watch = body.trips; await web.putConfig("trips changed on the flightwatch website"); return { ok: true }; }
  if (path === "/api/settings") {
    Object.assign(web.raw.settings, body.settings);
    await web.putConfig("settings changed on the flightwatch website");
    return { ok: true, warning: Object.keys(body.keys || {}).length ? "מפתחות אפשר לשנות רק מהמסך שבמחשב" : null };
  }
  if (path === "/api/auto") {
    web.raw.settings.auto_checks = !!body.enabled;
    await web.putConfig("automatic checks " + (body.enabled ? "resumed" : "paused") + " on the website");
    return { ok: true };
  }
  if (path === "/api/check") {
    const info = await web.gh("GET", "");
    await web.gh("POST", "/actions/workflows/flightwatch.yml/dispatches", { ref: info.default_branch || "main" });
    return { ok: true };
  }
  if (path === "/api/cloud/refresh") return { ok: true };
  throw new Error("לא זמין באתר. אפשר לעשות את זה מהמסך שבמחשב.");
}

async function api(path, body) {
  if (WEB) return webApi(path, body);
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN }, body: JSON.stringify(body),
  };
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `שגיאה ${r.status}`);
  return data;
}

async function refresh() {
  if (WEB && !web.conn && !web.load()) return webLogin();
  try { state = await api("/api/state"); }
  catch (e) {
    if (WEB) { if (e.auth) { web.forget(); return webLogin(e.message); }
      showProblem("אין חיבור ל-GitHub: " + esc(e.message)); clearTimeout(pollTimer); pollTimer = setTimeout(refresh, 30000); return; }
    $("#banners").innerHTML = `<div class="banner bad">אין חיבור לשרת של הכלי. ודאי שהחלון של flightwatch פתוח.</div>`; return;
  }

  if (!WEB && state.version !== PAGE_VERSION) {
    showProblem("flightwatch עודכן. סגרי את החלון השחור של flightwatch ופתחי שוב מהסמל בשולחן העבודה.");
    return;
  }
  render();
  clearTimeout(pollTimer);
  pollTimer = setTimeout(refresh, state.running ? (WEB ? 10000 : 3000) : 60000);
}

    out.push(`<div class="banner bad"><div class="grow">בעיה בקובץ ההגדרות: ${esc(state.config_error)}</div></div>`);

      <a href="https://serpapi.com/users/sign_up" target="_blank" rel="noopener">להרשמה</a>, ואחריה להעתיק את "Your Private API Key" ללשונית ההגדרות.</div>
      <button class="btn" onclick="showTab('settings')">להגדרות</button></div>`);
  if (state.cloud && state.cloud.error)
    out.push(`<div class="banner bad"><div class="grow">אין חיבור לענן: ${esc(state.cloud.error)}. אם מפתח הגישה של GitHub פג, צרי מפתח חדש והדביקי אותו בהגדרות ← ענן.</div>
      <button class="btn" onclick="showTab('settings')">להגדרות</button></div>`);
  if (state.schedule.supported && state.schedule.enabled && !state.schedule.installed)
    out.push(`<div class="banner warn"><div class="grow">הבדיקה האוטומטית עוד לא מוגדרת במחשב.</div>
      <button class="btn" onclick="installSchedule()">להפעיל בדיקה כל ${state.schedule.hours} שעות</button></div>`);
  if (state.keys.SERPAPI_KEY && !state.trips.length)
    out.push(`<div class="banner good"><div class="grow">הכול מוכן. נשאר להוסיף טיול שאחריו לעקוב.</div>
      <button class="btn primary" onclick="newTrip()">טיול חדש</button></div>`);
  $("#banners").innerHTML = out.join("");
}

/* ---------- results ---------- */
function spark(points) {
  if (points.length < 2) return "";
  const ys = points.map(p => p[1]), min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const w = 130, h = 34, step = w / (points.length - 1);
  const pts = points.map((p, i) => `${(w - i * step).toFixed(1)},${(h - 4 - (p[1] - min) / span * (h - 8)).toFixed(1)}`).join(" ");
  const last = pts.split(" ").pop().split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-label="מגמת מחיר"><polyline fill="none" stroke="#1f6feb" stroke-width="1.8" points="${pts}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="#1f6feb"/></svg>`;
}

function landing(p, dest) {
  if (!dest || !dest.airports || dest.airports.length < 2 || !p.arr) return "";
  const note = noteFor(dest.label, p.arr) || noteFor(dest.label, p.dep);
  const code = dest.airports.includes(p.arr) ? p.arr : p.dep;
  return `<br><span class="land">✈ נחיתה ב${esc(AIRPORTS[code] || code)} (${esc(code)})${note ? " · " + esc(note) : ""}</span>`;
}
function partText(p) {
  const nights = p.ret ? Math.round((new Date(p.ret) - new Date(p.depart)) / 864e5) : null;
  return p.ret
    ? `<span class="when">${fmtDate(p.depart)} (${dayName(p.depart)}) – ${fmtDate(p.ret)} (${dayName(p.ret)})</span> · ${nights} לילות`
    : `<span class="when">${fmtDate(p.depart)} (${dayName(p.depart)})</span> · כיוון אחד`;
}

function optionHtml(o, dest) {
  if (!o.split) {
    const p = o.parts[0];
    return `${partText(p)}${landing(p, dest)}<br><span class="sub">${p.describe ? esc(p.describe) + " · " : ""}נבדק ${ago(p.age_hours)}</span>`;
  }
  const [a, b] = o.parts;
  return `<span class="tag">שני כרטיסים נפרדים</span><br>
    הלוך: ${partText(a)} – ${money(a.price, o.currency)} <a href="${esc(a.link)}" target="_blank" rel="noopener">פתח</a><br>
    חזור: ${partText(b)} – ${money(b.price, o.currency)} <a href="${esc(b.link)}" target="_blank" rel="noopener">פתח</a>`;
}

function renderResults() {
  const el = $("#tab-results");
  const trips = state.results.filter(t => t.enabled);
  if (!trips.length) {
    el.innerHTML = `<div class="card empty">עוד אין טיולים פעילים.<br><br><button class="btn primary" onclick="newTrip()">הוספת טיול</button></div>`;
    return;
  }
  const cur = state.settings.currency;
  el.innerHTML = trips.map(t => {
    const trip = state.trips.find(x => x.name === t.trip) || {};
    const when = trip.depart_from ? `יציאה בין ${fmtDate(trip.depart_from)} ל-${fmtDate(trip.depart_to)}` +
      (trip.one_way ? " · כיוון אחד" : ` · ${trip.min_nights}${trip.max_nights !== trip.min_nights ? "–" + trip.max_nights : ""} לילות`) : "";
    // Cheapest option first, so the destinations compare at a glance.
    const sorted = t.destinations.slice().sort((a, b) =>
      (a.options[0]?.price ?? Infinity) - (b.options[0]?.price ?? Infinity));
    const priced = sorted.filter(d => d.options.length).length;
    const rows = sorted.map((d, idx) => {
      const best = d.options[0];
      const key = t.trip + "|" + d.destination;
      const pct = d.total ? Math.round(100 * d.checked / d.total) : 0;
      const priceCell = best ? `<div class="price">${money(best.price, best.currency)}</div><div class="sub">לנוסע מבוגר</div>`
        : `<div class="price none">${d.total ? "עוד לא נבדק" : "התאריכים עברו"}</div>` +
          (d.hint_price ? `<div class="sub">הערכה: ${money(d.hint_price, cur)}</div>` : "");
      const detail = best ? optionHtml(best, d) +
          (best.split ? "" : ` <a href="${esc(best.parts[0].link)}" target="_blank" rel="noopener">פתח ב-Google Flights</a>`) +
          (d.options.length > 1 ? `<br><button class="linkbtn" onclick="toggleOpen('${esc(key)}')">${open[key] ? "הסתר" : "עוד " + (d.options.length - 1) + " אפשרויות"}</button>` : "")
        : `<span class="sub">יגיע לתור בבדיקות הקרובות</span>`;
      const more = open[key] && d.options.length > 1 ? `<div class="more"><table>${d.options.slice(1).map(o =>
          `<tr><td style="width:90px;font-weight:600">${money(o.price, o.currency)}</td><td>${optionHtml(o, d)}${o.split ? "" :
          ` <a href="${esc(o.parts[0].link)}" target="_blank" rel="noopener">פתח</a>`}</td></tr>`).join("")}</table></div>` : "";
      return `<div class="dest">
        <div><div class="dname">${esc(cityName(d.destination))}</div><div class="dcode">${esc((d.airports || [d.destination]).join(" · "))}</div>
          ${idx === 0 && priced > 1 ? '<span class="best">הכי זול</span>' : ""}</div>
        <div>${priceCell}</div>
        <div class="detail">${detail}</div>
        <div class="spark-wrap">${spark(d.trend)}
          <div class="cover">נבדקו ${d.checked} מתוך ${d.total} שילובים<div class="meter"><div style="width:${pct}%"></div></div></div></div>
        ${more}</div>`;
    }).join("");
    const note = t.destinations.length > 1 ? ` · ${t.destinations.length} יעדים אפשריים, מהזול ליקר` : "";
    return `<div class="card"><h2>${esc(t.trip)}</h2><div class="sub">${when}${note}</div>${rows}</div>`;
  }).join("") + `<div class="card"><h2>הבדיקה האחרונה${state.cloud ? " (בענן)" : ""}</h2><pre>${esc(state.last_output || "עוד לא הייתה בדיקה.")}</pre></div>`;
}

function toggleOpen(key) { open[key] = !open[key]; renderResults(); }

/* ---------- trips ---------- */
function combos(t) {
  if (!t.depart_from || !t.depart_to) return 0;
  const days = Math.round((new Date(t.depart_to) - new Date(t.depart_from)) / 864e5) + 1;
  if (days < 1) return 0;
  if (t.one_way) return days;
  const n = Math.max(0, (+t.max_nights || 0) - (+t.min_nights || 0) + 1);
  return days * n + (t.split_tickets ? days + days + n - 1 : 0);
}

        ${t.one_way ? "· כיוון אחד" : `· ${t.min_nights}–${t.max_nights} לילות`}
        ${t.max_stops === 0 ? "· ישירות בלבד" : t.max_stops != null ? `· עד ${t.max_stops} עצירות` : ""}
        ${t.target_price ? `· מחיר יעד ${money(t.target_price, state.settings.currency)}` : ""}

      <div class="inline">
        <button class="btn" onclick="editTrip(${i})">עריכה</button>

        <button class="btn danger" onclick="deleteTrip(${i})">מחיקה</button>

  el.innerHTML = (editing ? tripForm() : `<div class="actions" style="margin:0 0 16px"><button class="btn primary" onclick="newTrip()">+ טיול חדש</button></div>`) +

function newTrip() {
  const d = new Date(); d.setDate(d.getDate() + 60);
  const iso = x => x.toISOString().slice(0, 10);
  const to = new Date(d); to.setDate(to.getDate() + 7);
  editing = { name: "", enabled: true, origins: ["TLV"], destinations: [], depart_from: iso(d), depart_to: iso(to),
              min_nights: 4, max_nights: 7, one_way: false, max_stops: null, target_price: null, split_tickets: false };
  editingIndex = -1; showTab("trips");
}

function readForm() {
  const f = $("#tripForm");
  const v = n => f.elements[n].value.trim();
  editing.name = v("name");
  editing.origins = v("origins").toUpperCase().split(/[\/, ]+/).filter(Boolean);
  editing.depart_from = v("depart_from"); editing.depart_to = v("depart_to");
  editing.min_nights = +v("min_nights") || 0; editing.max_nights = +v("max_nights") || 0;
  editing.max_stops = v("max_stops") === "" ? null : +v("max_stops");
  editing.target_price = v("target_price") === "" ? null : +v("target_price");
  editing.one_way = f.elements.one_way.checked;
  editing.split_tickets = f.elements.split_tickets.checked && !editing.one_way;
}

let formUpdate = () => {};
function bindForm() {
  const f = $("#tripForm");
  f.elements.max_stops.value = editing.max_stops ?? "";
  const update = () => {
    readForm();
    $("#nightsBox").style.display = editing.one_way ? "none" : "";
    $("#splitBox").style.display = editing.one_way ? "none" : "";
    $("#destChips").innerHTML = editing.destinations.map((d, i) =>
      `<span class="chip">${esc(cityName(d))} <span class="ltr">${esc(destCodes(d))}</span><button type="button" onclick="removeDest(${i})" title="הסר">×</button></span>`).join("");
    const c = combos(editing), n = editing.destinations.length;
    const perMonth = Math.round(state.usage.budget);
    $("#comboHint").innerHTML = n ? `${c} שילובי תאריכים לכל יעד אפשרי, ${c * n} בסך הכול. במכסה של ${perMonth} חיפושים בחודש, כל השילובים ייבדקו בערך פעם ב-${Math.max(1, Math.ceil(c * n / Math.max(1, perMonth) * 30))} ימים.
      הבדיקות מתמקדות בתאריכים הזולים שכבר נמצאו, כך שאין צורך לבדוק הכול.` : "";
  };
  f.addEventListener("input", update);
  const input = $("#destInput"), box = $("#destSuggest");
  const addCodes = key => {
    if (!editing.destinations.some(x => destCodes(x) === key)) editing.destinations.push(key);
    input.value = ""; box.hidden = true; $("#formErr").textContent = ""; update();
  };
  const pick = item => {
    if (item.region) { input.value = ""; box.hidden = true; $("#regionSel").value = item.region; showRegion(item.region); }
    else addCodes(item.code);
  };
  let items = [];
  const suggest = () => {
    items = searchDest(input.value);
    box.hidden = !items.length;
    box.innerHTML = items.map((it, i) => `<button type="button" data-i="${i}">${it.region
      ? `<b>${esc(it.region)}</b> <span class="sub">אזור · ${esc(it.detail)}</span>`
      : `<b>${esc(it.name)}</b> <span class="sub ltr">${esc(it.code)}</span>`}</button>`).join("");
    box.querySelectorAll("button").forEach(b => b.onclick = () => pick(items[+b.dataset.i]));
  };
  input.addEventListener("input", e => { e.stopPropagation(); suggest(); });
  input.addEventListener("focus", suggest);
  input.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const raw = input.value.toUpperCase().trim();
    const codes = raw.split(/[\/, +]+/).filter(Boolean);
    if (codes.length && codes.every(c => /^[A-Z]{3}$/.test(c)) && (codes.length > 1 || AIRPORTS[raw] || !items.length)) addCodes(codes.join("/"));
    else if (items.length) pick(items[0]);
  });
  document.addEventListener("click", e => { if (!e.target.closest(".destsearch")) box.hidden = true; });
  $("#regionSel").onchange = () => showRegion($("#regionSel").value);
  $("#saveTrip").onclick = saveTrip;
  formUpdate = update;
  update();
}

function showRegion(name) {
  const r = regionByName(name), box = $("#regionBox");
  if (!r) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="regionbox">
    <div class="sub" style="margin-bottom:6px">שדות תעופה שמשרתים את ${esc(r.name)} (זמני נסיעה ברכב, בערך):</div>
    ${r.airports.map(([c, note, on]) => `<label class="ap"><input type="checkbox" value="${c}" ${on ? "checked" : ""}>
      <b>${esc(AIRPORTS[c] || c)}</b> <span class="ltr">${c}</span><span class="sub">${esc(note)}</span></label>`).join("")}
    <div style="margin-top:8px">
      <label class="check"><input type="radio" name="rmode" value="one" checked>חיפוש אחד לכל השדות יחד – מציג את הזול מביניהם (חוסך חיפושים)</label>
      <label class="check"><input type="radio" name="rmode" value="each">כל שדה כאופציה נפרדת – מחיר לכל שדה (צורך יותר חיפושים)</label>
    </div>
    <div class="actions" style="margin-top:8px"><button class="btn primary" type="button" id="addRegion">הוספה</button>
      <button class="btn" type="button" id="cancelRegion">ביטול</button></div></div>`;
  $("#cancelRegion").onclick = () => { $("#regionSel").value = ""; box.innerHTML = ""; };
  $("#addRegion").onclick = () => {
    const codes = [...box.querySelectorAll("input[type=checkbox]:checked")].map(i => i.value);
    if (!codes.length) { $("#formErr").textContent = "צריך לסמן לפחות שדה תעופה אחד."; return; }
    const each = box.querySelector("input[name=rmode]:checked").value === "each";
    const add = d => { if (!editing.destinations.some(x => destCodes(x) === destCodes(d) || parseDest(x).label && parseDest(x).label === parseDest(d).label)) editing.destinations.push(d); };
    if (each || codes.length === 1) codes.forEach(c => add(c));
    else for (let i = 0; i < codes.length; i += MAX_PER_SEARCH) {
      const part = codes.slice(i, i + MAX_PER_SEARCH);
      add(`${r.name}${codes.length > MAX_PER_SEARCH ? " " + (i / MAX_PER_SEARCH + 1) : ""}: ${part.join("/")}`);
    }
    if (!editing.name) $("#tripForm").elements.name.value = r.name;
    $("#regionSel").value = ""; box.innerHTML = ""; $("#formErr").textContent = ""; formUpdate();
  };
}

function norm(t) { return String(t || "").toLowerCase().replace(/['"׳״\-–()]/g, "").trim(); }
function searchDest(q) {
  const n = norm(q);
  if (!n) return [];
  const up = q.trim().toUpperCase(), out = [];
  for (const r of REGIONS)
    if (norm(r.name).includes(n) || norm(REGION_EN[r.name]).includes(n) || r.airports.some(a => a[0] === up))
      out.push({ region: r.name, detail: r.airports.filter(a => a[2]).map(a => AIRPORTS[a[0]] || a[0]).filter((v, i, x) => x.indexOf(v) === i).slice(0, 3).join(", ") });
  for (const [code, name] of Object.entries(AIRPORTS)) {
    if (code === "TLV" || code === "ETM") continue;
    if (code === up || code.startsWith(up) && up.length >= 2 || norm(name).includes(n) || norm(EN[code]).includes(n))
      out.push({ code, name });
  }
  out.sort((a, b) => (b.code === up) - (a.code === up));
  return out.slice(0, 8);
}

function removeDest(i) { editing.destinations.splice(i, 1); formUpdate(); }

function validate(t) {
  if (!t.name) return "צריך לתת שם לטיול.";
  if (!t.origins.length || !t.origins.every(c => /^[A-Z]{3}$/.test(c))) return "שדה המוצא צריך להיות קוד של 3 אותיות, למשל TLV.";
  if (!t.destinations.length) return "צריך להוסיף לפחות יעד אחד.";
  if (!t.depart_from || !t.depart_to) return "צריך לבחור טווח תאריכי יציאה.";
  if (t.depart_to < t.depart_from) return "התאריך המאוחר מוקדם מהתאריך המוקדם.";
  if (!t.one_way && (t.min_nights < 1 || t.max_nights < t.min_nights)) return "טווח הלילות לא תקין.";
  const others = state.trips.filter((_, i) => i !== editingIndex);
  if (others.some(o => o.name === t.name)) return "כבר יש טיול בשם הזה.";
  return null;
}

async function saveTrips(trips, okMsg) {
  try { await api("/api/trips", { trips }); toast(okMsg); return true; }
  catch (e) { toast(e.message); $("#formErr") && ($("#formErr").textContent = e.message); return false; }
}

async function saveTrip() {
  const pending = $("#destInput").value.trim();
  if (pending) {
    const first = searchDest(pending)[0];
    if (first && !first.region) { if (!editing.destinations.some(x => destCodes(x) === first.code)) editing.destinations.push(first.code); }
    $("#destInput").value = "";
  }
  readForm();
  const err = validate(editing);
  if (err) { $("#formErr").textContent = err; return; }
  const trips = state.trips.slice();
  if (editingIndex < 0) trips.push(editing); else trips[editingIndex] = editing;
  if (await saveTrips(trips, "הטיול נשמר")) { editing = null; await refresh(); }
}
async function toggleTrip(i) {
  const trips = state.trips.slice(); trips[i] = { ...trips[i], enabled: !trips[i].enabled };
  if (await saveTrips(trips, trips[i].enabled ? "הטיול הופעל" : "הטיול הושהה")) refresh();
}
async function deleteTrip(i) {
  if (!confirm(`למחוק את "${state.trips[i].name}"?`)) return;
  const trips = state.trips.filter((_, j) => j !== i);
  if (await saveTrips(trips, "הטיול נמחק")) refresh();
}

/* ---------- settings ---------- */
function renderSettings() {
  const s = state.settings, k = state.keys;
  const totalCombos = state.trips.filter(t => t.enabled).reduce((a, t) => a + combos(t) * t.destinations.length, 0);
  const keyField = (name, label, help) => `<div><label>${label}</label>
    <input name="${name}" type="password" class="ltr" autocomplete="off" placeholder="${k[name] ? "שמור ✓ (להחלפה הדביקי חדש)" : ""}">
    <div class="hint">${help}</div></div>`;
  $("#tab-settings").innerHTML = cloudCard() + `<form id="settingsForm" onsubmit="return false">
  <div class="card"><h2>תדירות ומכסה</h2>
    <div class="grid" style="margin-top:12px">
      <div><label>לבדוק כל</label><select name="hours">${HOURS.map(h =>
        `<option value="${h}" ${h === state.schedule.hours ? "selected" : ""}>${h === 24 ? "יום" : h === 1 ? "שעה" : h + " שעות"}</option>`).join("")}</select>
        <div class="hint">${state.cloud ? "הבדיקות רצות בענן, גם כשהמחשב כבוי. GitHub מתחיל אותן לפעמים באיחור של כמה דקות."
          : (state.schedule.supported ? (state.schedule.installed ? "הבדיקה האוטומטית פעילה במחשב." : "הבדיקה האוטומטית עוד לא מוגדרת. היא תוגדר בשמירה.") : "בדיקה אוטומטית זמינה רק ב-Windows.")
          + " הבדיקה רצה גם כשהמסך הזה סגור, כל עוד המחשב דולק."}</div></div>
      <div><label>חיפושים בחודש</label><input type="number" name="serpapi_monthly_budget" min="0" value="${s.serpapi_monthly_budget}">
        <div class="hint">התוכנית החינמית של SerpApi: 250. התוכנית הבסיסית בתשלום: 1,000 ב-25$.</div></div>
      <div><label>מקסימום חיפושים בבדיקה אחת</label><input type="number" name="max_searches_per_run" min="1" max="50" value="${s.max_searches_per_run}">
        <div class="hint">חל גם על "בדוק עכשיו"</div></div>
      <div><label>לא לבדוק שוב את אותם תאריכים לפני (שעות)</label><input type="number" name="min_recheck_hours" min="0" value="${s.min_recheck_hours}"></div>
    </div>
    <div class="hint" id="rateHint" style="margin-top:12px"></div>
  </div>
  <div class="card"><h2>התראות ומחירים</h2>
    <div class="grid" style="margin-top:12px">
      <div><label>מטבע</label><select name="currency">${["USD", "EUR", "ILS", "GBP"].map(c => `<option ${c === s.currency ? "selected" : ""}>${c}</option>`).join("")}</select>
        <div class="hint">שינוי מטבע לא ממיר מחירים שכבר נשמרו</div></div>
      <div><label>התראה כשהמחיר לאותם תאריכים יורד ב- (%)</label><input type="number" name="drop_percent" min="1" max="90" value="${s.drop_percent}">
        <div class="hint">בנוסף מגיעה התראה על כל מחיר נמוך מכל מה שנמצא עד עכשיו</div></div>
    </div></div>
  ${WEB ? `<div class="card"><h2>מפתחות</h2><div class="sub">מפתחות (SerpApi, טלגרם) מנוהלים מהמסך שבמחשב, כדי שלא יעברו דרך הדפדפן.</div></div>` : ""}
  <div class="card" ${WEB ? "hidden" : ""}><h2>מפתחות</h2>
    <div class="grid" style="margin-top:12px">
      ${keyField("SERPAPI_KEY", "מפתח SerpApi (חובה)", `<a href="https://serpapi.com/users/sign_up" target="_blank" rel="noopener">הרשמה</a> · <a href="https://serpapi.com/manage-api-key" target="_blank" rel="noopener">איפה המפתח</a>`)}
      ${keyField("TRAVELPAYOUTS_TOKEN", "טוקן Travelpayouts (רשות)", "מחירים משוערים שעוזרים לבחור אילו תאריכים לבדוק")}
      ${keyField("TELEGRAM_BOT_TOKEN", "טוקן בוט טלגרם (רשות)", "נוצר אצל ‎@BotFather")}
      <div><label>Chat ID בטלגרם</label><input name="TELEGRAM_CHAT_ID" class="ltr" placeholder="${k.TELEGRAM_CHAT_ID ? "שמור ✓" : ""}">
        <div class="hint">אחרי ששלחת הודעה לבוט, הוא מופיע ב-getUpdates. ההוראות ב-README.</div></div>
    </div>
    <div class="actions"><button class="btn" type="button" id="testTg" ${k.TELEGRAM_BOT_TOKEN && k.TELEGRAM_CHAT_ID ? "" : "disabled"}>שליחת הודעת בדיקה לטלגרם</button></div>
  </div>
  <div class="err" id="setErr"></div>
  <div class="actions"><button class="btn primary" type="button" id="saveSettings">שמירת ההגדרות</button></div>
  </form>`;
  const f = $("#settingsForm");
  const rate = () => {
    const h = +f.elements.hours.value, budget = +f.elements.serpapi_monthly_budget.value || 0;
    const runs = Math.round(24 / h) * 30, per = budget / runs;
    $("#rateHint").innerHTML = `${runs} בדיקות בחודש, ` + (per >= 1 ? `בערך ${per.toFixed(per < 10 ? 1 : 0)} חיפושים בכל בדיקה.`
      : `חיפוש אחד בכל ${Math.round(1 / per)} בדיקות בערך (בשאר הבדיקות המכסה נחסכת).`) +
      (totalCombos ? ` בטיולים הפעילים יש ${totalCombos} שילובי תאריכים בסך הכול.` : "");
  };
  f.addEventListener("input", rate); rate();
  bindCloud();
  $("#saveSettings").onclick = saveSettings;
  $("#testTg").onclick = async () => {
    try { const r = await api("/api/test-notify", {}); toast(r.ok ? "נשלחה הודעה לטלגרם" : r.error); } catch (e) { toast(e.message); }
  };
}

/* ---------- cloud ---------- */
function cloudCard() {
  const c = state.cloud;
  if (WEB) {
    const r = c.last_run;
    const when = r && r.at ? new Date(r.at).toLocaleString("he-IL", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
    return `<div class="card"><h2>☁ מחובר לענן</h2>
      <div class="sub">המאגר: <a href="${esc(c.url)}" target="_blank" rel="noopener" class="ltr">${esc(c.repo)}</a>
        ${r ? ` · בדיקה אחרונה: ${when} ${r.status !== "completed" ? "(רצה עכשיו)" : r.conclusion === "success" ? "✓" : "(נכשלה)"}` : ""}</div>
      <div class="actions"><button class="btn danger" type="button" id="webForget">ניתוק המכשיר הזה</button></div></div>`;
  }
  if (c) {
    const r = c.last_run;
    const when = r && r.at ? new Date(r.at).toLocaleString("he-IL", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
    const res = !r ? "עוד לא רצה בדיקה" : r.status !== "completed" ? "רצה עכשיו..." :
      r.conclusion === "success" ? "הסתיימה בהצלחה" : `נכשלה (${esc(r.conclusion || "")})`;
    return `<div class="card"><h2>☁ ענן – פועל</h2>
      <div class="sub">הבדיקות רצות ב-GitHub גם כשהמחשב כבוי. התוצאות נשמרות במאגר
        <a href="${esc(c.url)}" target="_blank" rel="noopener" class="ltr">${esc(c.repo)}</a>, ושם אפשר לראות אותן גם מהטלפון.</div>
      <div style="margin-top:8px">בדיקה אחרונה בענן: ${when} · ${res}
        ${r && r.url ? `· <a href="${esc(r.url)}" target="_blank" rel="noopener">פרטים</a>` : ""}</div>
      <div class="site">
        <b>האתר שלך</b> – אותו מסך מכל מקום, גם מהטלפון וגם כשהמחשב כבוי:
        <div class="actions" style="margin-top:6px">
          <button class="btn primary" type="button" id="siteOpen">פתיחת האתר</button>
          <button class="btn" type="button" id="sitePhone">פתיחה בטלפון (קוד QR)</button>
          <button class="btn" type="button" id="sitePublish">פרסום / עדכון האתר</button></div>
        <div id="siteQr" class="qr"></div>
      </div>
      <div class="actions"><button class="btn" type="button" id="cloudRefresh">רענון מהענן</button>
        <button class="btn" type="button" id="cloudCode">עדכון הקוד בענן</button>
        <button class="btn danger" type="button" id="cloudOff">החזרת הבדיקות למחשב</button></div>
      <div class="hint">מפתח הגישה פג? צרי חדש באותו אופן והדביקי כאן:</div>
      <div class="inline" style="margin-top:6px"><input id="cloudToken2" type="password" class="ltr" placeholder="github_pat_..." style="max-width:360px">
        <button class="btn" type="button" id="cloudReconnect">עדכון מפתח</button></div>
      <div class="err" id="cloudErr"></div></div>`;
  }
  return `<div class="card"><h2>☁ בדיקה גם כשהמחשב כבוי</h2>
    <div class="sub">העברת הבדיקות לענן של GitHub, בחינם. אחרי ההעברה המחשב לא צריך להיות דולק, והתוצאות זמינות גם מהטלפון.</div>
    <ol style="margin:10px 0 0; padding-inline-start:20px; line-height:1.8">
      <li>אם אין לך חשבון: <a href="https://github.com/signup" target="_blank" rel="noopener">הרשמה ל-GitHub</a>.</li>
      <li><a href="https://github.com/new" target="_blank" rel="noopener">יצירת מאגר חדש</a>: בשם <b class="ltr">flightwatch</b>, לבחור <b>Private</b>, ולא לסמן שום דבר נוסף. ללחוץ Create repository.</li>
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">יצירת מפתח גישה</a>:
        שם <b class="ltr">flightwatch</b>, תוקף הכי ארוך שאפשר. ב-Repository access לבחור <b>Only select repositories</b> ואת flightwatch.
        ב-Permissions להוסיף ארבע הרשאות ברמת <b>Read and write</b>: <b class="ltr">Actions, Contents, Secrets, Workflows</b>.
        ללחוץ Generate token ולהעתיק את המפתח.</li>
      <li>להדביק כאן וללחוץ "העברה לענן":</li>
    </ol>
    <div class="grid" style="margin-top:10px">
      <div><label>המאגר</label><input id="cloudRepo" class="ltr" placeholder="username/flightwatch"></div>
      <div><label>מפתח הגישה</label><input id="cloudToken" type="password" class="ltr" placeholder="github_pat_..."></div>
    </div>
    <div class="actions"><button class="btn primary" type="button" id="cloudConnect">העברה לענן</button></div>
    <div class="err" id="cloudErr"></div><pre id="cloudLog" hidden></pre></div>`;
}

function loadQrLib() {
  return window.QRCode ? Promise.resolve() : new Promise((ok, bad) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    sc.onload = ok; sc.onerror = () => bad(new Error("לא הצלחתי לטעון את יוצר קוד ה-QR"));
    document.head.appendChild(sc);
  });
}

function bindCloud() {
  if (WEB) {
    $("#webForget").onclick = () => { if (confirm("לנתק את המכשיר הזה? יהיה צריך להתחבר שוב.")) { web.forget(); refresh(); } };
    return;
  }
  const err = m => { $("#cloudErr").textContent = m || ""; };
  if ($("#siteOpen")) {
    $("#siteOpen").onclick = async () => {
      try { const r = await api("/api/cloud/device-link", {}); window.open(r.link, "_blank"); } catch (e) { err(e.message); }
    };
    $("#sitePhone").onclick = async () => {
      try {
        const r = await api("/api/cloud/device-link", {}); await loadQrLib();
        const box = $("#siteQr"); box.innerHTML = "";
        new QRCode(box, { text: r.link, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
        box.insertAdjacentHTML("beforeend", `<div class="hint">סורקים במצלמה של הטלפון. הקוד כולל את מפתח הגישה, אז לא לשתף אותו.
          אפשר להוסיף את האתר למסך הבית של הטלפון.</div>`);
      } catch (e) { err(e.message); }
    };
    $("#sitePublish").onclick = async e => {
      e.target.disabled = true;
      try { const r = await api("/api/cloud/publish-site", {}); toast("האתר עודכן"); err(""); }
      catch (x) { err(x.message); }
      e.target.disabled = false;
    };
  }
  const connect = async (repo, token, btn) => {
    if (!repo || !token) { err("צריך למלא את שם המאגר ואת מפתח הגישה."); return; }
    btn.disabled = true; btn.textContent = "מעביר... (עד דקה)"; err("");
    try {
      const r = await api("/api/cloud/connect", { repo, token });
      toast("הבדיקות עברו לענן");
      if (r.warnings && r.warnings.length) alert("שימי לב:\n" + r.warnings.join("\n"));
      $("#tab-settings").innerHTML = ""; await refresh();
    } catch (e) { err(e.message); btn.disabled = false; btn.textContent = "נסי שוב"; }
  };
  if ($("#cloudConnect")) $("#cloudConnect").onclick = e => connect($("#cloudRepo").value.trim(), $("#cloudToken").value.trim(), e.target);
  if ($("#cloudReconnect")) $("#cloudReconnect").onclick = e => connect(state.cloud.repo, $("#cloudToken2").value.trim(), e.target);
  if ($("#cloudRefresh")) $("#cloudRefresh").onclick = async () => { await api("/api/cloud/refresh", {}); $("#tab-settings").innerHTML = ""; refresh(); toast("עודכן מהענן"); };
  if ($("#cloudCode")) $("#cloudCode").onclick = async e => {
    e.target.disabled = true;
    try { const r = await api("/api/cloud/update-code", {}); toast(r.uploaded ? `עודכנו ${r.uploaded} קבצים בענן` : "הקוד בענן כבר מעודכן"); }
    catch (x) { err(x.message); }
    e.target.disabled = false;
  };
  if ($("#cloudOff")) $("#cloudOff").onclick = async () => {
    if (!confirm("להחזיר את הבדיקות למחשב? הבדיקות בענן ייעצרו, והמחשב יצטרך להיות דולק כדי לבדוק.")) return;
    await api("/api/cloud/disconnect", {}); toast("הבדיקות חזרו למחשב"); $("#tab-settings").innerHTML = ""; refresh();
  };
}

async function saveSettings() {
  const f = $("#settingsForm"), v = n => f.elements[n].value.trim();
  const settings = {
    runs_per_day: Math.round(24 / +v("hours")), serpapi_monthly_budget: +v("serpapi_monthly_budget"),
    max_searches_per_run: +v("max_searches_per_run"), min_recheck_hours: +v("min_recheck_hours"),
    currency: v("currency"), drop_percent: +v("drop_percent"),
  };
  const keys = {};
  for (const n of ["SERPAPI_KEY", "TRAVELPAYOUTS_TOKEN", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]) if (v(n)) keys[n] = v(n);
  try {
    const r = await api("/api/settings", { settings, keys });
    $("#setErr").textContent = r.warning ? "ההגדרות נשמרו, אבל הבדיקה האוטומטית לא הוגדרה: " + r.warning : "";
    toast("ההגדרות נשמרו"); $("#tab-settings").innerHTML = ""; refresh();
  } catch (e) { $("#setErr").textContent = e.message; }
}

async function setAuto(enabled) {
  try {
    const r = await api("/api/auto", { enabled });
    toast(enabled ? "הבדיקה האוטומטית הופעלה" : "הבדיקה האוטומטית הושהתה");
    if (r.warning) showProblem("השינוי נשמר, אבל Windows לא אישר את השינוי בתזמון: " + esc(r.warning));
    await refresh();
  } catch (e) { toast(e.message); }
}

async function installSchedule() {
  try { const r = await api("/api/schedule", {}); toast(r.ok ? "הבדיקה האוטומטית הופעלה" : r.error); refresh(); }
  catch (e) { toast(e.message); }
}

/* ---------- tabs & boot ---------- */
let tab = "results";
function showTab(name) {
  tab = name;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  for (const t of ["results", "trips", "settings"]) $("#tab-" + t).hidden = t !== name;
  if (name !== "settings") $("#tab-settings").innerHTML = "";
  if (name === "trips" && state) renderTrips();
  render();
}
function render() {
  if (!state) return;
  renderHeader(); renderBanners();
  if (tab === "results") renderResults();
  // Forms are not redrawn by the background refresh, so typing is never lost.
  if (tab === "trips" && !editing) renderTrips();
  if (tab === "settings" && !$("#settingsForm")) renderSettings();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("#checkBtn").onclick = async () => {
  try { const r = await api("/api/check", {}); toast(r.ok ? "הבדיקה התחילה" : "כבר רצה בדיקה"); showTab("results"); refresh(); }
  catch (e) { toast(e.message); }
};
if (WEB) document.title = "flightwatch";
$("#airports").innerHTML = Object.entries(AIRPORTS).map(([c, n]) => `<option value="${c}">${n}</option>`).join("");
refresh();
</script>
